name: Build Index & Inject Recipe Schema
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Process Recipes & Generate Index
        run: |
          python3 - << 'EOF'
          import os, re, json, html
          from html.parser import HTMLParser

          class RecipeParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tag_stack = []
                  self.title = ""
                  self.desc = ""
                  self.text_lines = []
                  self.current_text = []
                  self.section = None
                  self.ingredients = []
                  self.instructions = []
                  self.in_li = False
                  self.li_text = []
                  self.found_h1 = False

              def handle_starttag(self, tag, attrs):
                  self.tag_stack.append(tag)
                  if tag == 'li':
                      self.in_li = True
                      self.li_text = []

              def handle_endtag(self, tag):
                  text = "".join(self.current_text).strip()
                  if tag == 'h1' and text and not self.title:
                      self.title = text
                      self.found_h1 = True
                  elif tag == 'p' and self.found_h1 and not self.desc and text:
                      self.desc = text
                  elif tag in ('h2', 'h3'):
                      low = text.lower()
                      if 'ingredient' in low:
                          self.section = 'ingredients'
                      elif 'instruction' in low or 'direction' in low:
                          self.section = 'instructions'
                      else:
                          self.section = None
                  elif tag == 'li' and self.in_li:
                      item = " ".join("".join(self.li_text).split())
                      if item:
                          if self.section == 'ingredients':
                              self.ingredients.append(item)
                          elif self.section == 'instructions':
                              self.instructions.append({"@type": "HowToStep", "text": item})
                      self.in_li = False

                  if text:
                      self.text_lines.append(text)
                  self.current_text = []
                  if self.tag_stack and self.tag_stack[-1] == tag:
                      self.tag_stack.pop()

              def handle_data(self, data):
                  self.current_text.append(data)
                  if self.in_li:
                      self.li_text.append(data)

          def parse_mins(text):
              if not text: return None
              h = re.search(r'(\d+)\s*(?:hr|hour)', text, re.I)
              m = re.search(r'(\d+)\s*(?:min)', text, re.I)
              mins = (int(h.group(1))*60 if h else 0) + (int(m.group(1)) if m else 0)
              return f"PT{mins}M" if mins > 0 else None

          recipes = []
          for fname in sorted(os.listdir('.')):
              if not fname.endswith('.html') or fname == 'index.html':
                  continue
              with open(fname, 'r', encoding='utf-8') as f:
                  raw = f.read()

              parser = RecipeParser()
              parser.feed(raw)
              title = parser.title or fname[:-5]
              recipes.append((fname, title))

              if 'application/ld+json' in raw and '"Recipe"' in raw:
                  continue

              lines = [l.strip() for l in parser.text_lines if l.strip()]
              prep_time, total_time, yield_val = None, None, None
              for i, line in enumerate(lines):
                  if line.lower() == 'prep time' and i + 1 < len(lines):
                      prep_time = parse_mins(lines[i+1])
                  elif line.lower() == 'total time' and i + 1 < len(lines):
                      total_time = parse_mins(lines[i+1])
                  elif line.lower() in ('servings', 'yield') and i + 1 < len(lines):
                      yield_val = lines[i+1]

              schema = {
                  "@context": "https://schema.org",
                  "@type": "Recipe",
                  "name": title,
                  "description": parser.desc,
                  "recipeIngredient": parser.ingredients,
                  "recipeInstructions": parser.instructions
              }
              if prep_time: schema["prepTime"] = prep_time
              if total_time: schema["totalTime"] = total_time
              if yield_val: schema["recipeYield"] = yield_val

              script_tag = f'\n<script type="application/ld+json">\n{json.dumps(schema, indent=2)}\n</script>\n'
              if '</body>' in raw:
                  raw = raw.replace('</body>', script_tag + '</body>')
              else:
                  raw += script_tag

              with open(fname, 'w', encoding='utf-8') as f:
                  f.write(raw)

          items = "\n".join(f'<li><a href="{html.escape(f)}">{html.escape(t)}</a></li>' for f, t in recipes)
          index_html = f"""<!DOCTYPE html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>My Recipes</title>
          <style>body{{font-family:system-ui,sans-serif;max-width:650px;margin:40px auto;padding:0 20px;line-height:1.6}}a{{text-decoration:none;color:#0969da}}a:hover{{text-decoration:underline}}li{{margin:8px 0}}</style>
          </head><body><h1>My Recipes</h1><ul>\n{items}\n</ul></body></html>"""
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index_html)
          EOF
      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update index and inject recipe schema" && git push)
